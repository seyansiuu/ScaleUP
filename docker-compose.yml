version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: scaleup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scaleup
      POSTGRES_PASSWORD: scaleup
      POSTGRES_DB: scaleup
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scaleup']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
